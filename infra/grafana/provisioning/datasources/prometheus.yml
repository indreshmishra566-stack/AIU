# ─────────────────────────────────────────────────────────────────────────────
#  AIU — Grafana Datasource Provisioning
#  Auto-configures Prometheus as default datasource on container start.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations: []
      timeInterval: "15s"
